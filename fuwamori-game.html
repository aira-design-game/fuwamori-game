<html lang="ja"><head>
<meta charset="utf-8">

<title>ふわもりさんぽ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:#f5e9e5;color:#402a2b}
body{display:flex;justify-content:center}
#app{width:min(100vw,430px);height:100dvh;background:#fffaf8;display:flex;flex-direction:column;overflow:hidden}
header{height:72px;padding:12px 15px 8px;display:flex;justify-content:space-between;align-items:center;flex:none}
.brand{font-size:21px;font-weight:900}.sub{font-size:10px;opacity:.55;margin-top:2px}
.timer{background:#402a2b;color:#fff;border-radius:13px;padding:6px 10px;text-align:center;min-width:56px}.timer small{display:block;font-size:7px;letter-spacing:.12em;opacity:.65}.timer b{font-size:19px;line-height:1}
.status{padding:0 15px 5px;flex:none}.row{display:flex;justify-content:space-between;align-items:end}.row span{font-size:10px;opacity:.6}.row strong{font-size:19px}.row em{font-size:10px;font-style:normal;opacity:.5}
.bar{height:6px;background:#f1ded9;border-radius:99px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#f4a5a3;border-radius:99px;transition:.25s}
.msg{height:29px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#775354;flex:none}
#field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:linear-gradient(#fff1ed 0%,#ffd9d2 45%,#dfb5ad 45.2%,#ae817b 100%)}
.sun{position:absolute;width:180px;height:180px;border-radius:50%;left:50%;top:45px;transform:translateX(-50%);background:#fff8d9;opacity:.38;filter:blur(3px)}
.cloud{position:absolute;width:85px;height:23px;border-radius:30px;background:#fff;opacity:.62}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:34px;height:34px;left:14px;bottom:3px}.cloud:after{width:27px;height:27px;right:14px;bottom:2px}
.c1{left:-20px;top:100px;animation:cloud 8s infinite ease-in-out}.c2{right:-25px;top:150px;transform:scale(.8);animation:cloud 9s -3s infinite ease-in-out}@keyframes cloud{50%{transform:translateX(18px)}}
.hill{position:absolute;left:-12%;width:124%;border-radius:50% 50% 0 0}.h1{height:210px;bottom:-125px;background:#d2aaa3;opacity:.7}.h2{height:180px;bottom:-112px;background:#a98079}
.petal{position:absolute;width:35px;height:35px;border:0;background:none;padding:0;transform:translate(-50%,-50%);z-index:5;animation:bob 1.5s infinite ease-in-out;cursor:pointer}.petal:before,.petal:after,.petal span{content:"";position:absolute;width:16px;height:24px;left:9px;top:5px;background:#f4a2a1;border-radius:100% 20% 100% 20%;box-shadow:0 4px 8px #6d39391c}.petal:after{transform:rotate(72deg)}.petal span{transform:rotate(144deg)}@keyframes bob{50%{transform:translate(-50%,-58%) rotate(8deg)}}
.char{position:absolute;width:108px;height:104px;transform:translate(-50%,-72%);z-index:8;pointer-events:none}.char img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 4px #552b2b26);animation:float 1.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px) rotate(1deg)}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;z-index:15;animation:spark .5s forwards}@keyframes spark{to{opacity:0;transform:scale(4)}}
.panel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;background:#fff2efc7;backdrop-filter:blur(7px)}
.mini{width:105px;height:100px;margin-bottom:5px}.mini img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 4px #552b2b22);animation:float 1.7s infinite}
h1,h2{margin:5px 0 7px;font-size:28px}p{font-size:12px;line-height:1.8;color:#765456;margin:0 0 17px}
button.start{border:0;border-radius:999px;background:#402a2b;color:white;padding:13px 25px;font-weight:900;box-shadow:0 6px #8e6561;font-size:13px}button.start:active{transform:translateY(4px);box-shadow:0 2px #8e6561}
.score{font-size:11px;letter-spacing:.14em;color:#806060;margin-bottom:17px}.score b{display:block;font-size:34px;letter-spacing:0;color:#402a2b}
footer{height:34px;display:grid;place-items:center;font-size:9px;color:#806b6b;flex:none}.dot{display:inline-block;width:5px;height:5px;background:#f3a1a0;border-radius:50%;margin-right:5px}
@media(min-width:431px){#app{height:min(920px,100dvh);margin:10px 0;border-radius:30px;box-shadow:0 20px 55px #542f2d22}}

<div class="panel" id="resultPanel" style="display:none"><div style="font-size:48px;color:#f1a1a0">✦</div><h2>ふわっと大成功！</h2><p>12枚の花びらを集めました。</p><div class="score">SCORE <b id="finalScore">0</b></div><button class="start" id="again">もう一度あそぶ</button></div>
</div><footer><span><span class="dot"></span><span id="hint">スマホの縦画面で遊べます</span></span></footer></div>
<script>
const field=document.getElementById('field'),char=document.getElementById('char'),petalsBox=document.getElementById('petals');
const timeEl=document.getElementById('time'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),msg=document.getElementById('msg');
const startPanel=document.getElementById('startPanel'),resultPanel=document.getElementById('resultPanel'),finalScore=document.getElementById('finalScore'),hint=document.getElementById('hint');
const positions=[[45,100],[125,90],[225,112],[325,95],[72,200],[165,180],[270,208],[345,185],[50,315],[145,290],[245,330],[330,305]];
let player={x:195,y:550,tx:195,ty:550},active=false,score=0,time=35,petals=[],timer=null,raf=null;
function reset(){score=0;time=35;active=true;player={x:195,y:550,tx:195,ty:550};scoreEl.textContent=0;timeEl.textContent=35;bar.style.width='0%';msg.textContent='花びらを12枚あつめよう';hint.textContent='タップした場所へ、ふわっと移動します';startPanel.style.display='none';resultPanel.style.display='none';petals=positions.map((p,i)=>({x:p[0],y:p[1],got:false,i}));renderPetals();clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish(false)},1000);cancelAnimationFrame(raf);loop()}
function renderPetals(){petalsBox.innerHTML='';petals.forEach(p=>{if(p.got)return;const b=document.createElement('button');b.className='petal';b.style.left=p.x+'px';b.style.top=p.y+'px';b.innerHTML='<span></span>';b.onpointerdown=e=>{e.stopPropagation();move(e)};petalsBox.appendChild(b)})}
function move(e){if(!active)return;const r=field.getBoundingClientRect();player.tx=Math.max(20,Math.min(r.width-20,e.clientX-r.left));player.ty=Math.max(70,Math.min(r.height-30,e.clientY-r.top))}
field.addEventListener('pointerdown',move);field.addEventListener('pointermove',e=>{if(e.buttons===1)move(e)});
function loop(){if(!active)return;const dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);if(d>1){const s=Math.min(5.5,d);player.x+=dx/d*s;player.y+=dy/d*s}char.style.left=player.x+'px';char.style.top=player.y+'px';petals.forEach(p=>{if(!p.got&&Math.hypot(player.x-p.x,player.y-p.y)<42){p.got=true;score++;scoreEl.textContent=score;bar.style.width=(score/12*100)+'%';msg.textContent=score===12?'ぜんぶ集めた！':'きらきらゲット！';const s=document.createElement('div');s.className='spark';s.style.left=p.x+'px';s.style.top=p.y+'px';field.appendChild(s);setTimeout(()=>s.remove(),500);renderPetals();if(score===12)finish(true)}});raf=requestAnimationFrame(loop)}
function finish(win){active=false;clearInterval(timer);cancelAnimationFrame(raf);if(win){finalScore.textContent=score*100+time*10;resultPanel.style.display='flex';hint.textContent='クリア！もう一度遊べます'}else{msg.textContent='時間切れ！もう一度挑戦しよう';startPanel.style.display='flex';hint.textContent='もう一度さんぽしてみよう'}}
document.getElementById('start').onclick=reset;document.getElementById('again').onclick=reset;renderPetals();char.style.left='195px';char.style.top='550px';
</script></body></html>
